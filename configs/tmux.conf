# ====================================
# jcaldwell-labs Contributor tmux Config
# ====================================
# Source: Adapted from be-dev-agent (PaymentService-specific removed)

# Reload config with Prefix + r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ====================================
# PREFIX & BASICS
# ====================================

# Change prefix to Ctrl-a (more ergonomic than Ctrl-b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable mouse support (scrolling, pane selection, resizing)
set -g mouse on

# Start window and pane numbering from 1 (keyboard layout friendly)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ====================================
# NAVIGATION & PANES
# ====================================

# Split panes with | and - (preserving current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation (Ctrl-a + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt-arrow pane navigation (no prefix needed)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Pane resizing (Ctrl-a + H/J/K/L for bigger steps)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick pane zoom (Ctrl-a + z)
bind z resize-pane -Z

# ====================================
# WINDOWS
# ====================================

# Create new window in current path
bind c new-window -c "#{pane_current_path}"

# Quick window navigation
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Don't rename windows automatically
set -g allow-rename off

# ====================================
# COPY MODE & SCROLLBACK
# ====================================

# Generous scrollback buffer (for log review)
set -g history-limit 50000

# Vi mode for copy mode
setw -g mode-keys vi

# Vi-style copy/paste
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# Enter copy mode with Ctrl-a + [
bind [ copy-mode

# ====================================
# VISUAL & STATUS BAR
# ====================================

# Colors (256 color support + true color)
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Status bar styling
set -g status-position bottom
set -g status-style bg=colour235,fg=colour136
set -g status-left-length 50
set -g status-right-length 100

# Left status: [session]
set -g status-left "#[fg=colour166,bold][#S] "

# Right status: directory | date time
# Using #{b:pane_current_path} - tmux built-in for basename (no subshell needed)
set -g status-right "#[fg=colour33]#{b:pane_current_path} #[fg=colour245]| #[fg=colour166]%Y-%m-%d #[fg=colour33]%H:%M"

# Window status styling
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=colour166,bold] #I:#W "

# Pane border colors
set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=colour33

# Message styling
set -g message-style bg=colour235,fg=colour166,bold

# ====================================
# PERFORMANCE & BEHAVIOR
# ====================================

# Faster command sequences (reduce escape time for vim)
set -s escape-time 0

# Display messages for 2 seconds
set -g display-time 2000

# Refresh status bar every 5 seconds
set -g status-interval 5

# Enable focus events (for vim autoread)
set -g focus-events on

# Aggressive resize (useful with multi-monitor)
setw -g aggressive-resize on

# ====================================
# UTILITY BINDINGS
# ====================================

# Git status in popup (Ctrl-a + G)
# Using -- and quotes to prevent command injection via malicious directory names
bind G display-popup -E "cd -- \"#{pane_current_path}\" && git status && echo '\nPress any key...' && read"

# ====================================
# SESSION MANAGEMENT
# ====================================

# Detach with Ctrl-a + d
bind d detach-client

# Kill session with confirmation
bind X confirm-before -p "Kill session #S? (y/n)" kill-session

# Switch between sessions (shows list)
bind s choose-tree -sZ

# ====================================
# QUICK REFERENCE
# ====================================
# Ctrl-a + |       - Split vertically
# Ctrl-a + -       - Split horizontally
# Ctrl-a + h/j/k/l - Navigate panes (vim-style)
# Alt + Arrow      - Navigate panes (no prefix)
# Ctrl-a + z       - Zoom current pane
# Ctrl-a + c       - New window
# Ctrl-a + [       - Copy mode (scroll with vim keys)
# Ctrl-a + G       - Git status popup
# Ctrl-a + s       - Session list
# Ctrl-a + r       - Reload config
