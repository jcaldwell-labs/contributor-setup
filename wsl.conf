# /etc/wsl.conf - WSL system configuration
# This file should be placed in /etc/wsl.conf on your WSL distribution

[boot]
# Enable systemd (WSL 2 only)
systemd=true

[network]
# Generate /etc/hosts file
generateHosts = true

# Generate /etc/resolv.conf file
generateResolvConf = true

[interop]
# Enable interoperability with Windows processes
enabled = true

# Append Windows PATH to Linux PATH
appendWindowsPath = true

[automount]
# Enable auto-mounting of Windows drives
enabled = true

# Mount point for Windows drives
root = /mnt/

# Mount options
options = "metadata,umask=22,fmask=11"

[user]
# Default user when starting WSL
# default = your_username
